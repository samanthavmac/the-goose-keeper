services:
  - type: web
    name: goose-keeper-golden-eggs
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn goose_keeper_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOSE_EGG_LIMIT
        value: "10"
      - key: DATABASE_URL
        fromDatabase:
          name: goose-keeper-db
          property: connectionString

databases:
  - name: goose-keeper-db
    plan: free
